# yaml-language-server: $schema=schema.json

controllers:
  - id: AXIS-X
    type: fastcs_ximc.XimcController

    connections:
      motor:
        type: fastcs_ximc.XimcConnection
        settings:
          ### Full uri
          uri: xi-emu:///tmp/fastcs-ximc/sim/axis.bin # (simulated)

          ### OR Serial device path, shorthand for xi-com://<port>:
          # port: /dev/ttyACM0

          ### OR Name of an environment variable holding the serial device path
          # port_env: AXIS_X_PORT

  # A second axis, on a node injected by a Kubernetes DRA claim. Role names are
  # local to an entry, so this one claims `motor` too and gets its own device.
  # Comment this entry out to run against the simulator alone.
  - id: AXIS-Y
    type: fastcs_ximc.XimcController
    poll_period: 0.5

    connections:
      motor:
        type: fastcs_ximc.XimcDRAConnection

        # The claim names the node at runtime, so this connection takes the
        # variable holding it and nothing else - no uri, no port.
        port_env: AXIS_Y_PORT

        # A claimed node does not come back by itself, so give up sooner than
        # the default 10 attempts a second.
        reconnect_period: 5.0
        reconnect_attempts: 3

transport:
  - epicsca: {}
    gui:
      title: "ximc"
      output_dir: ./opi/
